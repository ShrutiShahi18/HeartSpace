services:
  - type: web
    name: heartspace
    env: node
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install --production
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000

